name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # NEXT_PUBLIC_* values are inlined at build time, so the Pages build needs
    # them too. Set these as repository variables
    # (Settings > Secrets and variables > Actions > Variables). They must match
    # the Vercel Production/Preview variables, or the two hosts will ship
    # different endpoints.
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_SITE_HOST: ${{ vars.NEXT_PUBLIC_SITE_HOST }}
      NEXT_PUBLIC_FORM_ENDPOINT: ${{ vars.NEXT_PUBLIC_FORM_ENDPOINT }}
      NEXT_PUBLIC_FORM_KEY: ${{ vars.NEXT_PUBLIC_FORM_KEY }}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build Static (GitHub Pages)
        run: yarn export

      # next-sitemap reads the .next manifest, so it must run after the build.
      # The export already copied public/ into out/, so sync the fresh sitemap over.
      - name: Generate sitemap.xml
        run: |
          yarn next-sitemap
          cp public/sitemap*.xml out/

      - name: Deploy to External Repository
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          source-directory: 'out'
          destination-github-username: 'ethercraftguild'
          destination-repository-name: 'ethercraftguild.github.io'
          user-email: ${{ secrets.EMAIL }}
          target-branch: 'main'
